<!DOCTYPE html>
<html>
<head>
  <base href="/pawconnect_flutter/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PawConnect - Apple Liquid Glass Pet Companion App">

  <!-- iOS Safari Immersive Edge-to-Edge & Liquid Glass Meta Tags -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PawConnect">
  <meta name="format-detection" content="telephone=no">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PawConnect</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: dark;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: -webkit-fill-available;
      background-color: #0A0A0C;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    flt-glass-pane {
      width: 100% !important;
      height: 100% !important;
      height: 100dvh !important;
    }
  </style>
</head>
<body>
  <script>
    window._flutter = {
      config: {
        renderer: 'html',
      },
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
