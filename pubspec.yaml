name: pawconnect
description: "PawConnect - Apple Liquid Glass Pet Companion App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_map: ^8.3.1
  vector_map_tiles: ^9.0.0-beta.8
  vector_tile_renderer: ^6.0.0
  latlong2: ^0.9.1
  dio: ^5.5.0
  go_router: ^14.2.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map_styles/
